title: Leafcuttr
tagline: "Edge-native streaming"
description: "Leafcuttr is a multi-protocol edge gateway built on top of Apache Kafka, with native support for HTTP and MQTT. Designed to run on constrained hardware and flaky networks."
og_image: "/assets/images/og-image.svg"
og_type: "website"
twitter_card: "summary_large_image"
baseurl: ""
url: "https://leafcuttr.github.io"
permalink: pretty
markdown: kramdown
include:
  - _pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
sass:
  sass_dir: _sass
  style: compressed
defaults:
  - scope:
      path: "_pages"
    values:
      layout: page
